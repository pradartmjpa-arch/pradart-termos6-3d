
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Producto 3D</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            padding: 16px;
            box-sizing: border-box;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        model-viewer {
            width: min(90vw, 1000px);
            height: 90vh;
            min-height: 320px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        #ar-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 14px 20px;
            background-color: #ff9900;
            border: none;
            border-radius: 8px;
            color: #111111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        #ar-button:active {
            background-color: #e68a00;
        }
    </style>
</head>
<body>
    <model-viewer
    src="./Meshy_AI_Turquoise_Travel_Tumb_1111000609_texture.glb"
    alt="Visualización 3D del termo rosa"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate>

        <button slot="ar-button" id="ar-button">
            📦 Ver AR
        </button>
    </model-viewer>
</body>
</html>
